[theme]
# Основной цвет приложения (оранжевый для рамок, активных вкладок и кнопок)
primaryColor = "#FF6B00"

# Фон самого приложения (красивый глубокий темно-серый цвет)
backgroundColor = "#1E1E1E"

# Фон боковой панели (сайдбара) (чуть более темный серый для контраста)
secondaryBackgroundColor = "#121212"

# Цвет основного текста (светло-серый/белый, чтобы глаза не уставали)
textColor = "#E0E0E0"

# Шрифт по умолчанию
font = "sans serif"
